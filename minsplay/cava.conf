# cava для minsplay: сырые значения столбиков в stdout, рисует сам minsplay.
# bars должно совпадать с BARS в minsplay.py.

[general]
framerate = 60
bars = 48
autosens = 1
sleep_timer = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 70
